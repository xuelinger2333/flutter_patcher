name: CI
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
env:
  # The Android SDK jars Robolectric 4.14.1 (android/build.gradle) runs the JVM
  # tests on: 14 for Flutter 3.47, 15 for Flutter 3.50. "<version> <sha256>" each.
  ROBOLECTRIC_JARS: >-
    14-robolectric-10818077-i7 3fdac2d463f431c6b8d83b9d0ca739e795de75fffedee648c6761bd4bd864701
    15-robolectric-12650502-i7 33c2d7cc4186d4605269d5d411fa1818972c5b30a9f70bfbbd3d430b076af52f
  # Robolectric's native runtime, 158 MB, which Maven Central rate-limits most.
  # "<path under maven2/> <sha256>" each.
  ROBOLECTRIC_MAVEN: >-
    org/robolectric/nativeruntime-dist-compat/1.0.16/nativeruntime-dist-compat-1.0.16.jar 2f4e879b00eed634d0e43353ecff80db4d5ce24b3b213d1e6053cb21b0ced10f
    org/robolectric/nativeruntime-dist-compat/1.0.16/nativeruntime-dist-compat-1.0.16.pom 053dc5be36c03495d157186588b73952f4098cb9890f75cbd6ee26e36fd83d04
jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      # The supported versions are those on the artifacts repository's main branch,
      # so a version added there is tested here without a change to this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: xuelinger2333/flutter_patcher_artifacts
          ref: main
          persist-credentials: false
      - id: versions
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          versions = [v.strip() for v in Path('supported_versions.txt').read_text().splitlines() if v.strip() and not v.startswith('#')]
          assert versions and len(versions) == len(set(versions))
          assert all(re.fullmatch(r'\d+\.\d+\.\d+', v) for v in versions)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'version': versions}) + '\n')
          PY
      # Robolectric's Android jars and native runtime are fetched once here and cached;
      # the version jobs read them from the cache, so they do not each download them
      # from Maven Central.
      - id: robolectric
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/robolectric
          key: robolectric ${{ env.ROBOLECTRIC_JARS }} ${{ env.ROBOLECTRIC_MAVEN }}
      - if: steps.robolectric.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/robolectric"
          set -- $ROBOLECTRIC_JARS
          while [ $# -gt 0 ]; do
            jar="android-all-instrumented-$1.jar"
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 15 -o "$RUNNER_TEMP/robolectric/$jar" \
              "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$1/$jar"
            echo "$2  $RUNNER_TEMP/robolectric/$jar" | sha256sum -c -
            shift 2
          done
          set -- $ROBOLECTRIC_MAVEN
          while [ $# -gt 0 ]; do
            mkdir -p "$(dirname "$RUNNER_TEMP/robolectric/m2/$1")"
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 15 -o "$RUNNER_TEMP/robolectric/m2/$1" \
              "https://repo1.maven.org/maven2/$1"
            echo "$2  $RUNNER_TEMP/robolectric/m2/$1" | sha256sum -c -
            shift 2
          done
  fast:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: CLI publication to an isolated S3
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-tests"
          "$RUNNER_TEMP/ci-tests/bin/pip" install -r test/acceptance/test-requirements.txt
          export PATH="$RUNNER_TEMP/ci-tests/bin:$PATH"
          python3 test/acceptance/linux_tests.py --repo "$PWD" --dart "$(command -v dart)" --out "$PWD/.dart_tool/flutter_patcher/ci-fast"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/robolectric
          key: robolectric ${{ env.ROBOLECTRIC_JARS }} ${{ env.ROBOLECTRIC_MAVEN }}
          fail-on-cache-miss: true
      - name: Native JVM regression
        # Robolectric 4.14 cannot read the classes of Java 25, the runner's default JDK.
        # Offline, it reads its Android jars from the cache instead of Maven Central.
        # The init script has Gradle read the native runtime from the cache too; only the
        # plugin's project, as Flutter's own included build refuses project repositories.
        env:
          JAVA_TOOL_OPTIONS: -Drobolectric.offline=true -Drobolectric.dependency.dir=${{ runner.temp }}/robolectric
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/robolectric.gradle <<EOF
          allprojects {
              if (name == 'flutter_patcher') {
                  repositories {
                      exclusiveContent {
                          forRepository { maven { url = uri('$RUNNER_TEMP/robolectric/m2') } }
                          filter { includeModule('org.robolectric', 'nativeruntime-dist-compat') }
                      }
                  }
              }
          }
          EOF
          # Maven Central still answers 429 at random to some of the jobs' other requests;
          # only then is the step run again, with what Gradle fetched already cached.
          out="$PWD/.dart_tool/flutter_patcher/ci-native"
          for attempt in 1 2 3; do
            rm -rf "$out"
            if JAVA_HOME="$JAVA_HOME_21_X64" python3 test/acceptance/native_tests.py --repo "$PWD" --flutter "$(command -v flutter)" --out "$out" 2>&1 | tee "$RUNNER_TEMP/native.log"; then
              exit 0
            fi
            grep -q 'status code 429' "$RUNNER_TEMP/native.log" || exit 1
            sleep $((attempt * 60))
          done
          exit 1
      - run: echo 'Fast tests only; run test/acceptance/device_acceptance.py for device acceptance.' >> "$GITHUB_STEP_SUMMARY"

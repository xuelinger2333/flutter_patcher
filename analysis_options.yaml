include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
analyzer:
  exclude:
    # Workspace scratch space; experiment sources there are not part of the package.
    - temp/**
    - build/**
    - android/**
    # Compiled inside the generated acceptance app, beside its fixture_support.
    - test/acceptance/app/**
    - ios/**

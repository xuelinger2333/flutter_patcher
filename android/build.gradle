group = "com.flutter_patcher.flutter_patcher"
version = "1.0-SNAPSHOT"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Built-in Kotlin: this plugin applies no Kotlin Gradle plugin. Under AGP 9's
// built-in Kotlin, AGP compiles our sources; otherwise (AGP 8, or
// `android.builtInKotlin=false`) the Flutter Gradle Plugin applies the app's
// kotlin-android to plugins that do not. Either way the compiler options below
// apply once Kotlin is there.
def configureKotlin = {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}
if (extensions.findByName("kotlin") != null) {
    configureKotlin()
} else {
    plugins.withId("org.jetbrains.kotlin.android") { configureKotlin() }
}

tasks.matching { it.name ==~ /compile.*Kotlin/ }.configureEach {
    // Kotlin incremental cache path relativization can fail on Windows when a
    // Flutter plugin is compiled from Pub Cache on C: into an app on another
    // drive. Keep this library compile non-incremental; app modules are
    // unaffected.
    if (it.hasProperty("incremental")) it.incremental = false
}

android {
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    buildFeatures { buildConfig = true }
    namespace = "com.flutter_patcher.flutter_patcher"

    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
        def pluginVersion = (file('../pubspec.yaml').text =~ /(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9A-Za-z.]+)?\s*$/)
        if (!pluginVersion.find()) throw new GradleException('Stable plugin version required')
        buildConfigField 'String', 'PATCHER_VERSION', '"' + pluginVersion.group(1) + '"'
        minSdk = 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ABI 白名单：覆盖主流 Android 设备。Flutter 默认只出 arm64-v8a，
        // 但插件要兼容 32 位旧机型和 x86_64 模拟器。
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        // 让 AGP 把本插件的 consumer R8 规则合并到宿主 release build
        consumerProguardFiles 'consumer-rules.pro'
    }

    dependencies {
        androidTestImplementation("androidx.test:runner:1.7.0")
        androidTestImplementation("androidx.test.ext:junit:1.3.0")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.json:json:20240303")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            jvmArgs "-Dnet.bytebuddy.experimental=true"

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

